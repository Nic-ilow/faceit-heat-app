apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: faceit-heat
  namespace: faceit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: faceit-heat
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
